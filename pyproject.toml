[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haas-ai-a4-knowledge-hub"
version = "0.1.0"
description = "Personal wiki CLI with local Gemma (MLX) and keyword retrieval"
requires-python = ">=3.11"
dependencies = ["mlx-lm>=0.31"]

[project.scripts]
wiki = "wiki_cli.cli:main"

[tool.setuptools]
packages = ["wiki_cli"]
